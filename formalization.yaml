      lean: "Camus.Challenge.tree_displays_iff"
      module: "Solution"
      status: "proved"
    - source: "Equation (1)"
      lean: "Camus.Challenge.edgeWeight_eq"
      module: "Solution"
      status: "proved"
    - source: "Section 2.4, the reticulation restriction"
      lean: "Camus.Challenge.reticulation_restriction"
      module: "Solution"
      status: "proved"
    - source: "Section 2.4, the modified array exists"
      lean: "Camus.Challenge.exists_budgetArray"
      module: "Solution"
      status: "proved"
    - source: "Section 2.4, monotonicity claim (refuted)"
      lean: "Camus.Challenge.not_exactCountMonotone"
