fidelity:
  divergences: >-
    Equation (1) is read over the distinct quartets of Q, with their multiplicities as weights,
    as Section 2.3 allows (summing over the multiset would count multiplicities twice).
    Pairs(v) is restricted to pairs that give a network (recipient not an ancestor of the donor,
    ends not the root), as the paper's description of Pairs(v) intends; read literally it makes
    the recurrence circular. Section 2.4's recurrence and backtracking are the formalization's own
    (the paper describes only the meaning of M[v,k]); its stopping rule is read as the claim that
    the score does not improve after the column where the rule stops, and refuted. Section 2.3's
    bounds are proved for a program in a unit-cost semantics (one unit per table access,
    arithmetic operation, comparison and loop iteration), with a space component for peak memory
    (one unit per cell, a table entry, list element or call frame holding a constant number of
    integers, declared by annotations that Lean checks only for the program they wrap). Section 3.2
    is formalized inside the site model of Warnow, Tabatabaee and Evans, with p(e, s, s) > 0 on the
    tree edges added to their constraints, which the step of their Theorem 6 needs; "the most
    probable quartet tree" is read
    as strictly the most probable; ASTRAL's output is an exact maximizer of the quartet support
    score, which has the quartets of t, hence equals t up to the order of children. Section 3.4's
    motivation is proved for a positive threshold, and under the network coalescent for networks
    without the anomalous configuration, which the paper's design overlooks. The monotonicity
    claim of Section 2.4 is refuted for exact numbers of reticulations and proved for at most k;
    the uniqueness claim of Section 3.2 is refuted, and recovery is
    proved under identifiability under inclusion and a fewest-reticulation tie-break. Every proof
    follows the paper's, except two steps: uniqueness in Lemma 1, which the paper derives from
    Observation 2, which gives only existence (the formalization proves it from the
    vertex-disjointness of the cycles); and Theorem 1 over Definition 1's class, whose networks
    with the root above the root of T the paper's proof does not treat (the formalization reduces
    them to networks obtained by adding edges, with the same quartets and reticulations).
review:
  status: "agent-reviewed"
  reviewers: ["Independent Codex review agents (first round)", "Independent Claude review agents (second to fourth rounds)"]
  notes: "Statements checked against the published JATS source by agents other than their writers in every round (in the fourth, those of the SNP pipeline during the round and the others after the report); proofs compared with the paper's; the report's findings and account of the literature checked against their sources in the second to fourth rounds. No person has reviewed the proofs."
alignment:
  namespace: "Camus.Challenge"
  statements:
    - source: "Theorem 1"
      lean: "Camus.Challenge.theorem1"
      module: "Solution"
      status: "proved"
      note: "Against every network built on T in the sense of Definition 1."
    - source: "Theorem 1, the hypotheses can be met"
      lean: "Camus.Challenge.exists_array_trace"
      module: "Solution"
      status: "proved"
    - source: "Definition 1, quartets of a tree"
      lean: "Camus.Challenge.tree_displays_iff"
      module: "Solution"
      status: "proved"
    - source: "Equation (1)"
      lean: "Camus.Challenge.edgeWeight_eq"
      module: "Solution"
      status: "proved"
    - source: "Definition 1, networks built on T"
      lean: "Camus.Challenge.definition1_reduction"
      module: "Solution"
      status: "proved"
    - source: "Definition 1, networks built on T, the class is larger than the root-kept class"
      lean: "Camus.Challenge.builtOn_not_anchored"
      module: "Solution"
      status: "proved"
    - source: "Section 2.4, the reticulation restriction"
      lean: "Camus.Challenge.reticulation_restriction"
      module: "Solution"
      status: "proved"
      note: "For the networks returned by backtracking through the formalization's recurrence."
    - source: "Section 2.4, the modified array and its backtracking exist"
      lean: "Camus.Challenge.exists_budget_traces"
      module: "Solution"
      status: "proved"
    - source: "Section 2.4, monotonicity claim (refuted)"
      lean: "Camus.Challenge.not_exactCountMonotone"
      module: "Solution"
      status: "proved"
      note: "Refutes the paper's claim for exact numbers of reticulations."
    - source: "Section 2.4, stopping rule (refuted)"
      lean: "Camus.Challenge.not_exactStoppingRule"
      module: "Solution"
      status: "proved"
      note: "Refutes the claim that the score does not improve after the column where the rule stops, for exact numbers of reticulations."
    - source: "Section 2.4, stopping rule, at most k reticulations (refuted)"
      lean: "Camus.Challenge.not_atMostStoppingRule"
      module: "Solution"
      status: "proved"
    - source: "Section 3.2, uniqueness claim (refuted)"
      lean: "Camus.Challenge.not_uniqueOptimum"
      module: "Solution"
      status: "proved"
      note: "Refutes the paper's claim."
    - source: "Section 3.2, corrected recovery"
      lean: "Camus.Challenge.recovery"
      module: "Solution"
      status: "adapted"
      note: "Adds identifiability under inclusion and a fewest-reticulation tie-break."
    - source: "Section 3.2, corrected recovery applies to trees"
      lean: "Camus.Challenge.tree_identifiable"
      module: "Solution"
      status: "proved"
    - source: "Section 3.2, corrected recovery needs identifiability"
      lean: "Camus.Challenge.recovery_needs_identifiable"
      module: "Solution"
      status: "proved"
      note: "Even with the fewest-reticulation tie-break, CAMUS may return a network that is not isomorphic to the true one."
acknowledgements: "Lean, Mathlib and the formalize-math-paper skill; the paper's authors are credited bibliographically."
