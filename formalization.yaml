version: "v0.4"
project:
  name: "CAMUS: optimality of a dynamic program for level-1 phylogenetic networks"
  description: >-
    A Lean 4 and Mathlib formalization of Willson and Warnow, "CAMUS: scalable phylogenetic
    network estimation" (Bioinformatics 2026). CAMUS adds edges to a rooted binary tree T to
    obtain a rooted level-1 phylogenetic network that displays as many quartets of a multiset Q
    as possible. The formalization proves the paper's Theorem 1 (its dynamic program is optimal
    over every finite directed rooted binary level-1 network built on T in the sense of
    Definition 1), Lemmas 1 and 2, the running time and memory of Section 2.3 for CAMUS written as
    a program in a cost semantics, the reticulation-restricted dynamic program of Section 2.4 with
    its backtracking, that every level-1 network is built on one of its trees, and the steps of the
    statistical arguments of Sections 3.2 to 3.4 inside the models they use (the site model of
    Warnow, Tabatabaee and Evans, the multispecies coalescent and the network multispecies
    coalescent), by the paper's arguments. It also proves Observation 2 of Warnow, Tabatabaee
    and Evans (2025), on which Lemma 1 rests and which its authors state without proof, and the
    convergence of the quartets of SNPs under their site model, which needs a hypothesis that their
    model omits; the formalization is unconditional.


    Four claims of the paper are refuted: the best score with exactly k reticulations can decrease
    as k grows, and the stopping rule can stop before a better score (Section 2.4); the true network
    need not be the unique optimal network, even with the fewest reticulations and long cycles, so
    that CAMUS can return another network under every hypothesis of the SNP pipeline's consistency
    argument; and a tree of a network need not be a basis for it (Section 3.2). Under the network
    coalescent, on a network in an anomalous configuration known from the literature, with suitable
    edge lengths, Quartet Filtering keeps a quartet that the network does not display and drops the
    one it does (Sections 3.3 and 3.4); for the 3-cycle above two taxa the region of parameters in
    which this happens is determined, up to its boundary. A corrected recovery theorem holds under identifiability under inclusion and a tie-break toward
    the fewest reticulations.
  authors: ["The-Anh Vu-Le"]
  license: "Apache-2.0"
  responsible_maintainers: ["The-Anh Vu-Le"]
