fidelity:
  divergences: >-
    Equation (1) is read over the distinct quartets of Q, with their multiplicities as weights,
    as Section 2.3 allows (summing over the multiset would count multiplicities twice).
    Pairs(v) is restricted to pairs that give a network (recipient not an ancestor of the donor,
    ends not the root), as the paper's description of Pairs(v) intends; read literally it makes
    the recurrence circular. "Built on T" is read with the root of T preserved, the class over
    which the dynamic program optimizes. Section 2.4's recurrence is the formalization's own
    (the paper describes only the meaning of M[v,k]); its networks are given by existence.
    Section 2.3's bounds bound explicit operation counts under a unit-cost model. The
    monotonicity claim of Section 2.4 is refuted for exact numbers of reticulations and proved
    for at most k; the uniqueness claim of Section 3.2 is refuted, and recovery is proved under
    identifiability under inclusion and a fewest-reticulation tie-break. Every proof follows the
    paper's, except uniqueness in Lemma 1: the paper derives it from Observation 2, which gives
    only existence, and the formalization proves it from the vertex-disjointness of the cycles.
