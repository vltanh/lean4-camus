version: "v0.4"
project:
  name: "CAMUS: conditional optimality and audited corrections"
  description: >-
    Conditional Lean formalization of CAMUS over finite directed rooted binary
    level-1 support-tree extensions. It develops graph realization and completeness,
    switching and cut invariance, quartet attribution, dynamic programming and
    explicit corrections to reticulation monotonicity and statistical recovery.
  authors: ["The-Anh Vu-Le"]
  license: "Apache-2.0"
  responsible_maintainers: ["The-Anh Vu-Le"]
classification:
  arxiv: ["math.CO", "q-bio.PE"]
  msc2020: ["05C90", "92D15"]
sources:
  - title: "CAMUS: scalable phylogenetic network estimation"
    authors: ["James Willson", "Tandy Warnow"]
    id: "doi:10.1093/bioinformatics/btag245"
    type: "article"
    location: "https://academic.oup.com/bioinformatics/article/42/Supplement_1/btag245/8726316"
    relationship: "formalizes"
    note: "Published JATS/MathML source; conditional cited result and approved corrections are detailed in REPORT.md."
    license: "CC-BY-4.0"
    author_endorsement: "not-contacted"
  - title: "Advances in Estimating Level-1 Phylogenetic Networks from Unrooted SNPs"
    authors: ["Tandy Warnow", "Yasamin Tabatabaee", "Steven N. Evans"]
    id: "doi:10.1089/cmb.2024.0710"
    type: "article"
    location: "https://doi.org/10.1089/cmb.2024.0710"
    relationship: "background"
    note: "Observation 2 is an explicitly named, unproved hypothesis of the main formal theorem."
    author_endorsement: "not-contacted"
related_formalizations: []
status:
  scope: >-
    Conditional on named Warnow–Tabatabaee–Evans Observation 2. Proves unrestricted
    CAMUS optimality and exact-count knapsack optimality over every finite directed
    rooted binary level-1 extension with a root-preserving support subdivision.
    Includes actual graph realization/completeness, quartet attribution, scalar
    and exact-budget array existence, reticulation bounds and abstract unit-cost
    operation/storage bounds. Recovery assumes explicit inclusion-identifiability,
    minimum-reticulation tie-breaking and empirical-support convergence. Biological
    model implications, experiments, executable-runtime correspondence and the
    exact-budget early-stopping claim are not formalized. Counterexamples certify
    the approved corrections; the directed budget refutation uses Observation 2 only for its universal upper bound.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods:
    - method: "agent"
      models: ["gpt-6.1-sol"]
      framework: "Codex CLI 0.162.0-alpha.2"
      tool_setup: >-
        formalize-math-paper skill 2.2.0; three collaborating subagents,
        maximum four agents including parent; Lean kernel and Mathlib,
        private artifact snapshots, independent source and proof review.
      cost:
        wall_time: "1 h 56 min 31 s to REPORT commit a13d877; 2 h 30 min 15 s subagent active time; 4 h 26 min 46 s including parent"
        spend_usd: "not tracked"
        hardware: "local Lean build environment; remote model service"
      prompting_notes: >-
        User invoked the formalization skill and authorized corrected consistency,
        at-most monotonicity, an explicit Observation 2 hypothesis and completion
        of the directed-network library and full theorem.
  spend_usd: "not tracked"
  notes: "Final run accounting is derived from local Codex JSONL transcripts; inherited fork histories are excluded. See CREDITS.md and docs/run-stats.json."
fidelity:
  divergences: >-
    Conditional on named cited Observation 2. Equation 1 counts each observed
    topology once with multiplicity as its weight. Candidate pairs obey the valid
    directed-network condition implicit in the source edge-above construction.
    The extension domain preserves the supplied root. Exact-budget monotonicity
    is refuted and replaced by at-most-budget monotonicity. Automatic uniqueness
    and consistency are replaced by explicit inclusion-identifiability,
    minimum-reticulation tie-breaking and empirical-support convergence.
    The main proof follows the paper's own cycle decomposition and Equations 1–5.
    A supplementary Lemma 1 representation bridge proves deletion/suppression
    equivalent to the canonical endpoint graph, reusing Lemma 2 for ghost-wire
    ownership without replacing the attribution argument.
review:
  status: "agent-reviewed"
  reviewers: ["Independent Codex source-review agent", "Independent Codex completeness reviewer"]
  notes: "Published JATS statements, proof routes, graph bridges and findings reviewed; all-library axiom audit, source routes and Lean/NanoDa Comparator passed; no human mathematical endorsement claimed."
alignment:
  namespace: "CamusResults"
  statements:
