      lean: "CamusResults.optimalNetwork"
      module: "Solution"
      status: "proved"
      note: "Full graph optimizer statement, conditional on named cited Observation 2; proved graph bridges."
    - source: "Equation 1, weighted distinct-topology interpretation"
      lean: "CamusResults.equation1"
      module: "Solution"
      status: "proved"
    - source: "Section 2.4, approved correction"
      lean: "CamusResults.atMostBudgetMonotone"
      module: "Solution"
      status: "adapted"
    - source: "Section 3.2, approved corrected recovery"
      lean: "CamusResults.correctedRecovery"
      module: "Solution"
      status: "adapted"
acknowledgements: "Lean, Mathlib and the formalize-math-paper skill; source authors credited bibliographically."
