version: "v0.4"
project:
  name: "CAMUS: optimality of a dynamic program for level-1 phylogenetic networks"
  description: >-
    A Lean 4 and Mathlib formalization of Willson and Warnow, "CAMUS: scalable phylogenetic
    network estimation" (Bioinformatics 2026). CAMUS adds edges to a rooted binary tree T to
    obtain a rooted level-1 phylogenetic network that displays as many quartets of a multiset Q
    as possible. The formalization proves the paper's Theorem 1 (its dynamic program is optimal
    over every finite directed rooted binary level-1 network built on T), Lemmas 1 and 2, and the
    reticulation-restricted dynamic program of Section 2.4, by the paper's arguments. It also
    proves Observation 2 of Warnow, Tabatabaee and Evans (2025), a characterization of the
    quartets displayed by a level-1 network that the paper's Lemma 1 rests on and that its
    authors state without proof, so the formalization is unconditional.


    Two claims of the paper are refuted: the best score with exactly k reticulations can
    decrease as k grows (Section 2.4), and the true network need not be the unique optimal
    network, which CAMUS itself may miss (Section 3.2). A corrected recovery theorem holds under
    identifiability under inclusion and a tie-break toward the fewest reticulations.
  authors: ["The-Anh Vu-Le"]
  license: "Apache-2.0"
  responsible_maintainers: ["The-Anh Vu-Le"]
classification:
  arxiv: ["math.CO", "q-bio.PE"]
  msc2020: ["05C90", "92D15"]
