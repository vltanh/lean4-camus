related_formalizations: []
status:
  scope: >-
    Unconditional. Proves Lemmas 1 and 2, Theorem 1 and the four properties of the networks of
    Section 2.4 over every finite directed rooted binary level-1 network built on the constraint
    tree with its root preserved (the class over which the paper's dynamic program optimizes),
    the bound of n - 1 reticulations for such networks, Observation 2 of Warnow, Tabatabaee and
    Evans, unit-cost operation and memory counts for Sections 2.3 and 2.4, and the test of
    Algorithm 1. Refutes Section 2.4's monotonicity claim for exact numbers of reticulations and
    Section 3.2's uniqueness claim, and proves corrected versions. Equation (1) is read over
    distinct quartets and Pairs(v) restricted to pairs that give a network. Not formalized: the
    statistical models and consistency arguments of Section 3, Section 2.4's stopping rule and
    backtracking, a cost semantics of an implementation, Definition 1's networks whose root lies
    above the constraint tree's, and the experiments.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
