status:
  scope: >-
    Unconditional. Proves Lemmas 1 and 2 and Theorem 1 over every network built on the constraint
    tree in the sense of Definition 1 (whose root may lie above the root of the tree), that every
    level-1 network is built on one of its trees with at most n - 1 reticulations, the running time
    O(n^2 (|Q| + n)) and the peak memory O(n^4) of Section 2.3 for CAMUS written as a program in a
    cost semantics with time and space (the memory of each step declared in the program and checked
    by reading), with the quartet test in constant time, the four properties
    of the networks of Section 2.4 for the networks returned by backtracking with the running time
    O(n^2 (|Q| + m^3 n)) of the program that computes them, Observation 2 of Warnow, Tabatabaee and
    Evans and the convergence of the quartets of SNPs under their site model, Section 3.2's argument
    as one statement about the SNP pipeline (ASTRAL's tree equals the true tree up to the order of
    children, by Steel's theorem that quartets determine a tree), Algorithm 1's test and its
    motivation under the multispecies coalescent and the network multispecies coalescent, and under
    the latter the recovery through every tree of the network with an outgroup (under
    identifiability and the tie-break) and the symmetry of
    the model under the exchange of the two sides of a cycle. Refutes
    Section 2.4's monotonicity claim for exact numbers of reticulations and its stopping rule, and
    Section 3.2's uniqueness claim (also with the fewest-reticulation tie-break, and in the site
    model under every hypothesis of its argument) and its claim that any tree of a network is a
    basis for it, and proves corrected versions; shows that Quartet Filtering keeps a quartet the
    network does not display under the network coalescent, on a network in the anomalous
    configuration of Ané et al. (2024) with suitable edge lengths, and determines the region of
    parameters in which this happens on the 3-cycle above two taxa, up to its boundary. Equation (1) is read over distinct quartets and Pairs(v) restricted to pairs that
    give a network. Not formalized: that every displayed tree of a network of the network
    coalescent, in the model's sense, is a tree of its graph in CAMUS's representation; the region
    of the anomaly for arbitrary networks; and the experiments.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
